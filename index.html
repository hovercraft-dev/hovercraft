<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a1628">
    <title>Hovercraft's ATR 72 Tools</title>
    <link rel="icon" type="image/png" href="assets/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
    <button id="themeToggle" class="theme-toggle-btn" type="button" aria-label="Toggle dark mode">🌙</button>
    <h1>Hovercraft's <span>ATR 72-600 Flight Tools</span></h1>
    <nav class="tabs" role="tablist" aria-label="Tools">
        <button id="tabBags" class="tab active" type="button" role="tab"
                aria-selected="true" aria-controls="panelBags">Bags</button>
        <button id="tabWind" class="tab" type="button" role="tab"
                aria-selected="false" aria-controls="panelWind">Wind</button>
    </nav>
</header>

<main class="content">

<!-- ── Baggage splitter ── -->
<section id="panelBags" class="panel active" data-tab="bags" role="tabpanel" aria-labelledby="tabBags">

    <div class="card card-artwork">
        <div class="atr-profile">
            <img src="assets/atr-profile.png" alt="ATR 72-600 side profile showing FWD and AFT cargo holds">
        </div>
    </div>

    <div class="card">
        <h2 class="card-title">Baggage Splitter</h2>

        <div class="grid2">
            <div>
                <label for="totalBags">Total Bags</label>
                <input type="number" inputmode="numeric" id="totalBags" placeholder="0">
            </div>
            <div>
                <label for="totalWeight">Total Weight</label>
                <input type="number" inputmode="decimal" id="totalWeight" placeholder="Kg">
            </div>
        </div>
        <div id="avgWeightDisp" class="avg-display"></div>

        <hr class="divider">

        <label for="fwdBagTarget">Option A &mdash; Split by FWD Bag Count</label>
        <input type="number" inputmode="numeric" id="fwdBagTarget" placeholder="Target bags for FWD">

        <label for="fwdWeightTarget">Option B &mdash; Split by FWD Weight</label>
        <input type="number" inputmode="decimal" id="fwdWeightTarget" placeholder="Target Kg for FWD">

        <div class="result-row">
            <div class="result-box fwd">
                <div class="result-label">FWD HOLD</div>
                <div id="fwdBagsRes" class="result-val">&ndash;</div>
                <div id="fwdWeightRes" class="result-sub fwd-col">0 kg</div>
            </div>
            <div class="result-box aft">
                <div class="result-label">AFT HOLD</div>
                <div id="aftBagsRes" class="result-val">&ndash;</div>
                <div id="aftWeightRes" class="result-sub aft-col">0 kg</div>
            </div>
        </div>

        <button id="clearBagsBtn" class="btn btn-danger" type="button">CLEAR ALL</button>
    </div>
</section>

<!-- ── Crosswind calculator ── -->
<section id="panelWind" class="panel" data-tab="wind" role="tabpanel" aria-labelledby="tabWind">

    <div class="card">
        <h2 class="card-title">Runway</h2>
        <div id="rwyBar" class="rwy-bar"></div>
        <div id="rwyEditor" class="rwy-editor"></div>
    </div>

    <div class="card">
        <h2 class="card-title">Crosswind Calculator</h2>

        <div class="grid2">
            <div>
                <label for="rwyHdg">RWY Heading</label>
                <input type="number" inputmode="numeric" id="rwyHdg" placeholder="e.g. 261">
            </div>
            <div>
                <label for="windDir">Wind Direction</label>
                <input type="number" inputmode="numeric" id="windDir" placeholder="e.g. 310">
            </div>
        </div>

        <div class="grid2">
            <div>
                <label for="windSpd">Wind Speed (KT)</label>
                <input type="number" inputmode="numeric" id="windSpd" placeholder="Sustained">
            </div>
            <div>
                <label for="gustSpd">Gust (KT)</label>
                <input type="number" inputmode="numeric" id="gustSpd" placeholder="Optional">
            </div>
        </div>

        <label for="rwyCond">Runway Condition (RCAM)</label>
        <select id="rwyCond"></select>

        <div class="result-row">
            <div class="result-box">
                <div class="result-label">CROSSWIND</div>
                <div id="xWindRes" class="result-val">0 KT</div>
                <div id="xWindGust" class="result-sub gust-note"></div>
            </div>
            <div class="result-box">
                <div class="result-label" id="windLabel">HEADWIND</div>
                <div id="hWindRes" class="result-val">0 KT</div>
                <div id="hWindGust" class="result-sub gust-note"></div>
            </div>
        </div>

        <div id="windStatus" class="status-pill status-pass">WAITING FOR INPUT</div>

        <div class="diagram-wrap">
            <canvas id="windDiagram" width="520" height="520"></canvas>
        </div>

        <button id="clearWindBtn" class="btn btn-secondary" type="button">CLEAR WIND</button>
    </div>
</section>

</main>

<script type="module" src="src/main.js"></script>
</body>
</html>
